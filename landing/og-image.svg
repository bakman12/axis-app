<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030309"/>
      <stop offset="100%" stop-color="#0c0c18"/>
    </linearGradient>
    <!-- Orange glow -->
    <radialGradient id="glow1" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet glow -->
    <radialGradient id="glow2" cx="20%" cy="75%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <!-- Text gradient for headline -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Card shadow filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <!-- Noise texture -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="720" y="80" width="400" height="470" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Glows -->
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>
  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- ── Left content ── -->

  <!-- Badge -->
  <rect x="80" y="100" width="184" height="30" rx="15" fill="rgba(249,115,22,0.09)" stroke="rgba(249,115,22,0.22)" stroke-width="1"/>
  <circle cx="101" cy="115" r="4" fill="#f97316" opacity="0.9"/>
  <text x="114" y="120" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="rgba(249,115,22,0.9)" letter-spacing="1.8">MEDICATION TRACKING</text>

  <!-- Headline -->
  <text x="80" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="700" fill="url(#textGrad)" letter-spacing="-4">Never</text>
  <text x="80" y="300" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="700" fill="url(#textGrad)" letter-spacing="-4">Miss a</text>
  <text x="80" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="82" font-weight="700" fill="url(#textGrad)" letter-spacing="-4">Dose.</text>

  <!-- Sub-text -->
  <text x="80" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="20" fill="rgba(136,146,164,0.9)">AI reminders · Biometric security · Travel mode</text>

  <!-- Branding -->
  <text x="80" y="530" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#f0f0f8" letter-spacing="-1.2">Axis<tspan fill="#f97316">.</tspan></text>
  <text x="80" y="558" font-family="system-ui,-apple-system,sans-serif" font-size="14" fill="rgba(82,92,110,0.9)" letter-spacing="0.5">axisrx.app</text>

  <!-- ── Right card ── -->
  <rect x="720" y="80" width="400" height="470" rx="20"
        fill="#07070f" stroke="rgba(255,255,255,0.11)" stroke-width="1"
        filter="url(#cardShadow)"/>

  <!-- Card top bar -->
  <rect x="720" y="80" width="400" height="60" rx="20" fill="#0c0c18"/>
  <rect x="720" y="120" width="400" height="20" fill="#0c0c18"/>
  <circle cx="752" cy="110" r="6" fill="#ef4444" opacity="0.6"/>
  <circle cx="772" cy="110" r="6" fill="#f59e0b" opacity="0.6"/>
  <circle cx="792" cy="110" r="6" fill="#22c55e" opacity="0.6"/>
  <text x="870" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="rgba(240,240,248,0.6)" text-anchor="middle">Today's Schedule</text>

  <!-- Date chip -->
  <rect x="740" y="155" width="160" height="26" rx="7" fill="rgba(249,115,22,0.09)" stroke="rgba(249,115,22,0.2)" stroke-width="1"/>
  <text x="820" y="172" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#f97316" text-anchor="middle">Mon, 19 May 2026</text>

  <!-- Dose row 1 - taken -->
  <rect x="740" y="198" width="360" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="740" y="198" width="4" height="58" rx="2" fill="#22c55e"/>
  <circle cx="775" cy="227" r="14" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
  <text x="775" y="232" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#22c55e" text-anchor="middle">✓</text>
  <text x="802" y="222" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f0f8">Metformin 500mg</text>
  <text x="802" y="239" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(136,146,164,0.8)">8:00 AM · With food</text>
  <rect x="1040" y="210" width="46" height="22" rx="6" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
  <text x="1063" y="225" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">Taken</text>

  <!-- Dose row 2 - upcoming (orange) -->
  <rect x="740" y="268" width="360" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <rect x="740" y="268" width="4" height="58" rx="2" fill="#f97316"/>
  <circle cx="775" cy="297" r="14" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.3)" stroke-width="1"/>
  <text x="775" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#f97316" text-anchor="middle">💊</text>
  <text x="802" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f0f8">Lisinopril 10mg</text>
  <text x="802" y="309" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(136,146,164,0.8)">2:00 PM · 1 hr 20 min</text>
  <rect x="1035" y="280" width="52" height="22" rx="6" fill="rgba(249,115,22,0.1)" stroke="rgba(249,115,22,0.2)" stroke-width="1"/>
  <text x="1061" y="295" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#f97316" text-anchor="middle">Soon</text>

  <!-- Dose row 3 - later (violet) -->
  <rect x="740" y="338" width="360" height="58" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="740" y="338" width="4" height="58" rx="2" fill="#8b5cf6"/>
  <circle cx="775" cy="367" r="14" fill="rgba(139,92,246,0.12)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="775" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#a78bfa" text-anchor="middle">💊</text>
  <text x="802" y="362" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f0f0f8">Vitamin D3 · 50mcg</text>
  <text x="802" y="379" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(136,146,164,0.8)">6:00 PM · Evening</text>
  <rect x="1035" y="350" width="52" height="22" rx="6" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
  <text x="1061" y="365" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#a78bfa" text-anchor="middle">Later</text>

  <!-- Adherence bar -->
  <rect x="740" y="415" width="360" height="1" fill="rgba(255,255,255,0.06)"/>
  <text x="752" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(82,92,110,0.9)">Weekly adherence</text>
  <rect x="888" y="430" width="172" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
  <rect x="888" y="430" width="162" height="6" rx="3" fill="url(#textGrad)"/>
  <text x="1068" y="440" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="700" fill="#f0f0f8">94%</text>

  <!-- Lock icon at card bottom -->
  <text x="920" y="502" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="rgba(82,92,110,0.7)" text-anchor="middle">🔐  AES-256 encrypted · Zero knowledge</text>

</svg>
